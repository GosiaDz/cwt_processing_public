[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cwt-processing-public"
version = "0.1.0"
description = "Reproducible centered overlapping-peak generation and CWT Transformer experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
 "numpy>=1.26,<3", "scipy>=1.11,<2", "pandas>=2.1,<3",
 "matplotlib>=3.7,<4", "torch>=2.3,<3", "lightning>=2.4,<3"
]

[project.optional-dependencies]
web = ["streamlit>=1.39,<2"]
wavelets = ["ptwt>=1.0,<2"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["transformer/src"]
include = ["cwt_processing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
